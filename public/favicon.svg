<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="To-Do + Pomodoro">
  <title>To-Do + Pomodoro</title>
  <!-- Mosaico: lenguaje de app icon, garantiza contraste en pestaña clara y oscura -->
  <rect width="48" height="48" rx="11" fill="#18181b" />
  <!-- Dial de cuenta atrás (red-500, el color de WORK): arco abierto al noreste -->
  <path
    d="M38.01 20.25A14.5 14.5 0 1 1 27.75 9.99"
    fill="none"
    stroke="#ef4444"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- Tick más rotundo que el dial, su trazo largo apunta al hueco: la aguja del minutero -->
  <path
    d="M16.8 24.4 21.5 29.1 33.2 17.4"
    fill="none"
    stroke="#fafafa"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
